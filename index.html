<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neuro Runner // Unauthorized Subsystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
  <script>
    if (window.tailwind) window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: {
              400: '#00f0ff',
              500: '#00d8ff',
              900: '#003135',
              950: '#001a1c'
            }
          },
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            code: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --tg-viewport-height: 100dvh;
      --tg-viewport-stable-height: 100dvh;
      --tg-safe-area-top: env(safe-area-inset-top, 0px);
      --tg-safe-area-right: env(safe-area-inset-right, 0px);
      --tg-safe-area-bottom: env(safe-area-inset-bottom, 0px);
      --tg-safe-area-left: env(safe-area-inset-left, 0px);
    }

    html, body, #root {
      background-color: #000;
      color: #00f0ff;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: var(--tg-viewport-height, 100dvh);
      min-height: 100%;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    button, [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    .crt::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 100;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    .neon-text { text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); }

    .cyber-shape {
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 240, 255, 0.02); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); }

    .pt-safe { padding-top: var(--tg-safe-area-top, 0px); }
    .pr-safe { padding-right: var(--tg-safe-area-right, 0px); }
    .pb-safe { padding-bottom: var(--tg-safe-area-bottom, 0px); }
    .pl-safe { padding-left: var(--tg-safe-area-left, 0px); }
    .px-safe {
      padding-left: var(--tg-safe-area-left, 0px);
      padding-right: var(--tg-safe-area-right, 0px);
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .crt::after { opacity: 0.72; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@^19.2.4",
      "react/": "https://esm.sh/react@^19.2.4/",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "zustand": "https://esm.sh/zustand@^5.0.11",
      "zustand/": "https://esm.sh/zustand@^5.0.11/"
    }
  }
  </script>
  <script>
    (function() {
      const tg = window.Telegram?.WebApp;
      const root = document.documentElement;

      function setSafeArea(inset) {
        if (!inset) return;
        root.style.setProperty('--tg-safe-area-top', (inset.top || 0) + 'px');
        root.style.setProperty('--tg-safe-area-right', (inset.right || 0) + 'px');
        root.style.setProperty('--tg-safe-area-bottom', (inset.bottom || 0) + 'px');
        root.style.setProperty('--tg-safe-area-left', (inset.left || 0) + 'px');
      }

      function updateBrowserViewport() {
        if (tg && ['android', 'ios'].includes(tg.platform || 'unknown')) return;
        const height = window.visualViewport?.height;
        if (height && height > 0) root.style.setProperty('--tg-viewport-height', `${height}px`);
      }

      if (!tg) {
        updateBrowserViewport();
        window.visualViewport?.addEventListener('resize', updateBrowserViewport);
        window.addEventListener('orientationchange', updateBrowserViewport);
        return;
      }

      const isMobile = ['android', 'ios'].includes(tg.platform || 'unknown');

      function updateTelegramViewport() {
        if (!isMobile) {
          setSafeArea(tg.contentSafeAreaInset);
          updateBrowserViewport();
          return;
        }

        if (!tg.isExpanded) tg.expand();
        if (tg.requestFullscreen) {
          try { tg.requestFullscreen(); } catch(e) { console.log('Fullscreen not supported'); }
        }

        if (tg.viewportHeight) root.style.setProperty('--tg-viewport-height', `${tg.viewportHeight}px`);
        if (tg.viewportStableHeight) root.style.setProperty('--tg-viewport-stable-height', `${tg.viewportStableHeight}px`);
        setSafeArea(tg.contentSafeAreaInset);
      }

      tg.ready();
      updateTelegramViewport();
      tg.onEvent('viewportChanged', updateTelegramViewport);
      window.addEventListener('resize', updateTelegramViewport);
      window.addEventListener('orientationchange', updateTelegramViewport);
    })();
  </script>
</head>
<body class="bg-black crt">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
