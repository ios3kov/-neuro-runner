name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npm audit --audit-level=moderate
      - name: Browser tools
        run: |
          npm install --prefix /tmp/neuro-audit-tools --no-package-lock playwright@1.58.2 @axe-core/playwright@4.11.1
          node /tmp/neuro-audit-tools/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Cloudflare local headers and browser checks
        env:
          WRANGLER_SEND_METRICS: 'false'
          AUDIT_ORIGIN: http://127.0.0.1:8787
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/worker.log 2>&1 &
          node scripts/verify-headers.mjs
          node scripts/verify-browser.mjs
          AUDIT_BROWSER=webkit node scripts/verify-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: audit-results/
          retention-days: 7
