name: Verify and package audit candidate
on:
  push:
    branches: [audit/production-polish-2026-09-18]
permissions:
  contents: read
  actions: read
concurrency:
  group: final-audit-candidate
  cancel-in-progress: true
jobs:
  package:
    if: contains(github.event.head_commit.message, '[audit-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-f619f9f742550d46272cb6ebdcc3520409ce78da
          run-id: 35290808524
          github-token: ${{ github.token }}
          path: /tmp/candidate-evidence
      - name: Assemble the complete candidate, not the intermediate branch
        run: |
          mkdir -p /tmp/neuro-release
          tar -xzf /tmp/candidate-evidence/candidate-source.tar.gz -C /tmp/neuro-release
          cp public/_headers /tmp/neuro-release/public/_headers
          cp README.md /tmp/neuro-release/README.md
          cp scripts/verify-headers.mjs /tmp/neuro-release/scripts/verify-headers.mjs
          cp docs/AUDIT_HANDOFF.md /tmp/neuro-release/docs/AUDIT_HANDOFF.md
          cp scripts/release-ci.yml /tmp/neuro-release/.github/workflows/ci.yml
          rm -f /tmp/neuro-release/.github/workflows/audit-probe.yml /tmp/neuro-release/.github/workflows/polish-bootstrap.yml /tmp/neuro-release/.github/workflows/candidate-export.yml
          rm -f /tmp/neuro-release/scripts/apply-production-polish.py /tmp/neuro-release/scripts/finish-polish.py /tmp/neuro-release/scripts/export-candidate.mjs
          cd /tmp/neuro-release
          npm ci
          npm run typecheck && npm run lint && npm test && npm run build
          mkdir -p audit-results
          npm audit --json > audit-results/dependencies.json
      - name: Browser tools
        run: |
          npm install --prefix /tmp/neuro-audit-tools --no-package-lock playwright@1.58.2 @axe-core/playwright@4.11.1
          node /tmp/neuro-audit-tools/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Cloudflare local verification
        env:
          WRANGLER_SEND_METRICS: 'false'
          AUDIT_ORIGIN: http://127.0.0.1:8787
        run: |
          cd /tmp/neuro-release
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/worker.log 2>&1 &
          node scripts/verify-headers.mjs
          node scripts/verify-browser.mjs
          AUDIT_BROWSER=webkit node scripts/verify-browser.mjs
      - name: Package exact source, evidence and baseline patch
        if: always()
        run: |
          mkdir -p final-artifact/source
          cp -R /tmp/neuro-release/audit-results final-artifact/final-verification
          cp /tmp/neuro-release/docs/AUDIT_HANDOFF.md final-artifact/AUDIT_HANDOFF.md
          cp /tmp/candidate-evidence/baseline.json final-artifact/lab-performance.json
          if test -f /tmp/worker.log; then cp /tmp/worker.log final-artifact/cloudflare-local.log; fi
          rsync -a --delete --exclude=.git --exclude=.wrangler --exclude=node_modules --exclude=dist --exclude=audit-results --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.eot' /tmp/neuro-release/ final-artifact/source/
          git worktree add --detach /tmp/neuro-baseline 291b7c0f527cd0901810b2db87e5909ad5376ab8
          rsync -a --delete --exclude=.git final-artifact/source/ /tmp/neuro-baseline/
          git -C /tmp/neuro-baseline add -A
          git -C /tmp/neuro-baseline diff --cached --binary > final-artifact/final.patch
          python3 - <<'PY'
          from pathlib import Path
          forbidden={'.woff','.woff2','.ttf','.otf','.eot'}
          files=[p for p in Path('final-artifact').rglob('*') if p.is_file()]
          assert not any(p.suffix.lower() in forbidden for p in files)
          assert not any('node_modules' in p.parts or '.wrangler' in p.parts for p in files)
          print('PACKAGE_CONTENTS_VERIFIED',len(files))
          PY
          cd final-artifact
          sha256sum final.patch source/package-lock.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuro-runner-audit-final-${{ github.sha }}
          path: final-artifact/
          include-hidden-files: true
          retention-days: 14
