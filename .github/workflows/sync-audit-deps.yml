name: Sync audit dependencies
on:
  push:
    branches: [audit/production-polish-2026-09-18]
permissions:
  contents: write
jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-audit-deps]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild dependency graph from scratch
        run: |
          rm -rf node_modules
          npm install --prefix /tmp/neuro-npm --no-package-lock npm@11
          cli=/tmp/neuro-npm/node_modules/npm/bin/npm-cli.js
          node "$cli" install --save-exact @fontsource/share-tech-mono@5.3.0 @fontsource/jetbrains-mono@5.3.0
          node "$cli" install --save-dev --save-exact tailwindcss@3.4.17 postcss@8.5.28 autoprefixer@10.4.21 tailwindcss-animate@1.0.7 eslint@9.39.5 @typescript-eslint/parser@8.70.0 prettier@3.9.0 vitest@4.1.11 wrangler@4.134.0
      - name: Verify dependency graph
        run: |
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Persist lockfile only after green verification
        run: |
          git add package.json package-lock.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync audited dependencies'
          git push origin HEAD:audit/production-polish-2026-09-18
