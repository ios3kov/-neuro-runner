name: Apply ASTEROIDS hero renderer

on:
  push:
    branches:
      - art/asteroids-hero-pass
    paths:
      - .github/workflows/apply-asteroids-art.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/asteroids-hero-pass
          fetch-depth: 0
      - name: Integrate renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          renderer = Path('engine/games/asteroids/asteroidsRenderer.ts')
          r = renderer.read_text()
          r = r.replace("width: number, lowPowerMode: boolean): void => {", "width: number, height: number, lowPowerMode: boolean): void => {")
          r = r.replace("const pyScale = width / 100;", "const pyScale = height / 100;")
          r = r.replace("drawAsteroid(ctx, state, a, width, lowPowerMode)", "drawAsteroid(ctx, state, a, width, height, lowPowerMode)")
          renderer.write_text(r)

          path = Path('engine/games/Asteroids.tsx')
          text = path.read_text()
          if "import { useStore } from '../../store';" not in text:
              text = text.replace("import { useGameStore } from '../../gameStore';", "import { useGameStore } from '../../gameStore';\nimport { useStore } from '../../store';")
          type_anchor = "import type {"
          import_line = "import { drawAsteroidsScene } from './asteroids/asteroidsRenderer';"
          if import_line not in text:
              first_type = text.find("import type ")
              if first_type >= 0:
                  text = text[:first_type] + import_line + "\n" + text[first_type:]
              else:
                  text = text.replace("import { LogLevel } from '../../types';", "import { LogLevel } from '../../types';\n" + import_line)
          store_anchor = "  const updateStats = useGameStore"
          idx = text.find(store_anchor)
          if idx >= 0 and "const lowPowerMode = useStore" not in text:
              line_end = text.find("\n", idx)
              text = text[:line_end+1] + "  const lowPowerMode = useStore((s) => s.user.settings.lowPowerMode ?? false);\n" + text[line_end+1:]
          pattern = re.compile(r"  const draw = useCallback\(\(ctx: CanvasRenderingContext2D, width: number, height: number\) => \{.*?\n  \}, \[\]\);\n\n  const instructions", re.S)
          replacement = "  const draw = useCallback((ctx: CanvasRenderingContext2D, width: number, height: number) => {\n    drawAsteroidsScene(ctx, state.current, width, height, { lowPowerMode });\n  }, [lowPowerMode]);\n\n  const instructions"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one draw block replacement, got {count}')
          path.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-asteroids-art.yml
      - name: Commit integrated renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/games/Asteroids.tsx engine/games/asteroids/asteroidsRenderer.ts .github/workflows/apply-asteroids-art.yml
          git commit -m "Integrate ASTEROIDS technical-art renderer"
          git push origin HEAD:art/asteroids-hero-pass
