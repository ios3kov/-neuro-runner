name: Apply SERPENT hero renderer

on:
  push:
    branches:
      - art/serpent-hero-pass
    paths:
      - .github/workflows/apply-serpent-art.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/serpent-hero-pass
          fetch-depth: 0
      - name: Integrate renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('engine/games/Snake.tsx')
          text = path.read_text()

          anchor = "import { buildSnakeArena } from './snake/snakeLevelBuilder';"
          renderer_import = "import { drawSnakeScene } from './snake/snakeRenderer';"
          if renderer_import not in text:
              text = text.replace(anchor, anchor + "\n" + renderer_import)

          store_anchor = "  const addLog = useStore((s) => s.addLog);"
          low_power = "  const lowPowerMode = useStore((s) => s.user.settings.lowPowerMode ?? false);"
          if low_power not in text:
              text = text.replace(store_anchor, store_anchor + "\n" + low_power)

          pattern = re.compile(r"  const draw = useCallback\(\(ctx: CanvasRenderingContext2D, width: number, height: number\) => \{.*?\n  \}, \[\]\);\n\n  const instructions", re.S)
          replacement = "  const draw = useCallback((ctx: CanvasRenderingContext2D, width: number, height: number) => {\n    drawSnakeScene(ctx, state.current, width, height, { lowPowerMode });\n  }, [lowPowerMode]);\n\n  const instructions"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one draw block replacement, got {count}')

          path.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-serpent-art.yml
      - name: Commit integrated renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/games/Snake.tsx .github/workflows/apply-serpent-art.yml
          git commit -m "Integrate SERPENT technical-art renderer"
          git push origin HEAD:art/serpent-hero-pass
