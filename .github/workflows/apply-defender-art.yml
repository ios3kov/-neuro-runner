name: Apply DEFENDER hero renderer
on:
  push:
    branches: [art/defender-hero-pass]
    paths: [.github/workflows/apply-defender-art.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/defender-hero-pass
      - name: Integrate renderer
        shell: python
        run: |
          from pathlib import Path
          p = Path('engine/games/Defender.tsx')
          s = p.read_text()
          s = s.replace("import { useGameStore } from '../../gameStore';\n", "import { useGameStore } from '../../gameStore';\nimport { useStore } from '../../store';\n")
          s = s.replace("import type { DefenderEnemy, DefenderState } from './defender/defenderTypes';\n", "import type { DefenderEnemy, DefenderState } from './defender/defenderTypes';\nimport { drawDefenderScene } from './defender/defenderRenderer';\n")
          s = s.replace("  const updateStats = useGameStore(s => s.updateStats);\n", "  const updateStats = useGameStore(s => s.updateStats);\n  const lowPowerMode = useStore((s) => s.user.settings.lowPowerMode ?? false);\n")
          start = s.index('  const draw = useCallback(')
          end = s.index('  const instructions = useMemo', start)
          replacement = "  const draw = useCallback((ctx: CanvasRenderingContext2D, width: number, height: number) => {\n    drawDefenderScene(ctx, state.current, width, height, { lowPowerMode });\n  }, [lowPowerMode]);\n\n"
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-defender-art.yml
      - name: Commit integrated renderer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/games/Defender.tsx engine/games/defender/defenderRenderer.ts .github/workflows/apply-defender-art.yml
          git commit -m "Integrate DEFENDER technical-art renderer"
          git push origin HEAD:art/defender-hero-pass
