name: Apply refactor

on:
  push:
    branches: [refactor/all-recommendations-2026-09-10]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct verified source archive
        run: |
          cat \
            .refactor_payload/part00 \
            .refactor_payload/part01 \
            .refactor_payload/part02 \
            .refactor_payload/part03 \
            .refactor_payload/small/part040 \
            .refactor_payload/small/part041 \
            .refactor_payload/small/part042 \
            .refactor_payload/small/part050 \
            .refactor_payload/small/part051 \
            .refactor_payload/small/part052 \
            .refactor_payload/small/part060 \
            .refactor_payload/small/part061 \
            .refactor_payload/small/part062 \
            .refactor_payload/small/part070 \
            .refactor_payload/small/part071 \
            .refactor_payload/small/part072 \
            .refactor_payload/small/part08a > /tmp/refactor.b64
          test "$(wc -c < /tmp/refactor.b64)" -eq 99192
          base64 -d /tmp/refactor.b64 > /tmp/refactor.tar.xz
          xz -t /tmp/refactor.tar.xz
          tar -tJf /tmp/refactor.tar.xz > /tmp/archive-list.txt
      - name: Replace staged tree with refactored source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/refactor.tar.xz -C .
          rm -f .github/workflows/finalize-refactor.yml .github/workflows/apply-refactor.yml
      - name: Apply verified type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('components/AiChat.tsx')
          s = p.read_text()
          s = s.replace('const omniIteration = useStore((s) => s.omniIteration);', 'const omniIteration = useStore((s) => s.user.omniIteration);')
          p.write_text(s)

          p = Path('components/SettingsTool.tsx')
          s = p.read_text()
          s = s.replace('const settings = useStore((s) => s.user.settings);', 'const userSettings = useStore((s) => s.user.settings);')
          s = s.replace('  const settings = [', '  const settingItems = [')
          s = s.replace('active: settings.soundEnabled', 'active: userSettings.soundEnabled')
          s = s.replace('active: settings.musicEnabled', 'active: userSettings.musicEnabled')
          s = s.replace('active: settings.showHidden', 'active: userSettings.showHidden')
          s = s.replace('active: settings.hapticsEnabled ?? true', 'active: userSettings.hapticsEnabled ?? true')
          s = s.replace('active: settings.lowPowerMode ?? false', 'active: userSettings.lowPowerMode ?? false')
          s = s.replace('settings[index].action();', 'settingItems[index].action();')
          s = s.replace('settings.length', 'settingItems.length')
          s = s.replace('[focusedIndex, settings]', '[focusedIndex, settingItems]')
          s = s.replace('{settings.map((item, index) => (', '{settingItems.map((item, index) => (')
          p.write_text(s)
          PY
      - name: Lock dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified refactor
        run: |
          rm -rf dist
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete refactor and verification"
          git push
