name: Apply Battle original

on:
  push:
    branches:
      - feature/battle-original

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/battle-original
      - name: Vendor original Battle and register app wrapper
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/coding-horror/basic-computer-games/main"
          mkdir -p public/basic-computer-games/09_Battle/javascript
          mkdir -p public/basic-computer-games/00_Utilities/javascript
          curl -fsSL "$BASE/09_Battle/battle.bas" -o public/basic-computer-games/09_Battle/battle.bas
          curl -fsSL "$BASE/09_Battle/README.md" -o public/basic-computer-games/09_Battle/README.md
          curl -fsSL "$BASE/09_Battle/javascript/README.md" -o public/basic-computer-games/09_Battle/javascript/README.md
          curl -fsSL "$BASE/09_Battle/javascript/battle.html" -o public/basic-computer-games/09_Battle/javascript/battle.html
          curl -fsSL "$BASE/09_Battle/javascript/battle.js" -o public/basic-computer-games/09_Battle/javascript/battle.js
          curl -fsSL "$BASE/00_Utilities/javascript/style_terminal.css" -o public/basic-computer-games/00_Utilities/javascript/style_terminal.css
          curl -fsSL "$BASE/LICENSE" -o public/basic-computer-games/LICENSE

          cat > engine/games/Battle.tsx <<'EOF'
          import React from 'react';
          import { useStore } from '../../store';

          export const BattleGame: React.FC = () => {
            const stopGame = useStore((state) => state.stopGame);

            return (
              <div className="absolute inset-0 z-30 bg-black font-mono select-none overflow-hidden">
                <div className="absolute inset-x-0 top-0 z-20 h-12 border-b border-cyan-400/30 bg-black/95 flex items-center justify-between px-3">
                  <div className="text-[11px] tracking-[0.22em] text-cyan-300">BATTLE // ORIGINAL PORT</div>
                  <button
                    type="button"
                    onClick={stopGame}
                    className="min-h-11 px-4 border border-cyan-400/50 text-cyan-200 text-xs tracking-widest active:bg-cyan-300/15"
                  >
                    EXIT
                  </button>
                </div>
                <iframe
                  title="BATTLE"
                  src="/basic-computer-games/09_Battle/javascript/battle.html"
                  className="absolute inset-x-0 bottom-0 top-12 h-[calc(100%-3rem)] w-full border-0 bg-black"
                />
              </div>
            );
          };
          EOF

          python - <<'PY'
          from pathlib import Path

          p = Path('types.ts')
          s = p.read_text()
          old = "export type GameId = 'SNAKE' | 'PONG' | 'BREAKOUT' | 'ASTEROIDS' | 'DRIFT' | 'DEFENDER' | 'SETTINGS' | 'AI_CHAT' | 'RUNNER' | 'VAPORWARE' | 'CROSSWIRE';"
          new = "export type GameId = 'SNAKE' | 'PONG' | 'BREAKOUT' | 'ASTEROIDS' | 'DRIFT' | 'DEFENDER' | 'SETTINGS' | 'AI_CHAT' | 'RUNNER' | 'VAPORWARE' | 'CROSSWIRE' | 'BATTLE';"
          if old not in s:
              raise SystemExit('GameId anchor not found')
          p.write_text(s.replace(old, new))

          p = Path('components/AppContent.tsx')
          s = p.read_text()
          anchor = "import { CrosswireGame } from '../engine/games/Crosswire';\n"
          if anchor not in s:
              raise SystemExit('AppContent import anchor not found')
          s = s.replace(anchor, anchor + "import { BattleGame } from '../engine/games/Battle';\n")
          anchor = "    CROSSWIRE: CrosswireGame,\n"
          if anchor not in s:
              raise SystemExit('AppContent registry anchor not found')
          s = s.replace(anchor, anchor + "    BATTLE: BattleGame,\n")
          p.write_text(s)

          p = Path('data/fileSystem.ts')
          s = p.read_text()
          anchor = "  d('arcade', 'ARCADE', [\n"
          if anchor not in s:
              raise SystemExit('Arcade anchor not found')
          s = s.replace(anchor, anchor + "    f('battle', 'BATTLE.EXE', 'Original Naval Battle', 'BATTLE'),\n")
          anchor = "  DRIFT: '🏎️', DEFENDER: '🛡️'\n"
          if anchor not in s:
              raise SystemExit('Icon anchor not found')
          s = s.replace(anchor, "  DRIFT: '🏎️', DEFENDER: '🛡️', BATTLE: '⚓'\n")
          p.write_text(s)
          PY

          rm -f .github/workflows/apply-battle-original.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import original Battle game unchanged"
          git push origin HEAD:feature/battle-original
