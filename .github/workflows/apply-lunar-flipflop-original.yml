name: Apply Lunar and Flip Flop original
on:
  push:
    branches: [feature/lunar-flipflop-original]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lunar-flipflop-original
      - name: Vendor original games and register wrappers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/coding-horror/basic-computer-games.git /tmp/basic

          mkdir -p public/basic-computer-games/59_Lunar_LEM_Rocket/javascript
          cp /tmp/basic/59_Lunar_LEM_Rocket/README.md public/basic-computer-games/59_Lunar_LEM_Rocket/README.md
          cp /tmp/basic/59_Lunar_LEM_Rocket/lem.bas public/basic-computer-games/59_Lunar_LEM_Rocket/lem.bas
          cp /tmp/basic/59_Lunar_LEM_Rocket/lunar.bas public/basic-computer-games/59_Lunar_LEM_Rocket/lunar.bas
          cp /tmp/basic/59_Lunar_LEM_Rocket/rocket.bas public/basic-computer-games/59_Lunar_LEM_Rocket/rocket.bas
          cp /tmp/basic/59_Lunar_LEM_Rocket/javascript/README.md public/basic-computer-games/59_Lunar_LEM_Rocket/javascript/README.md
          cp /tmp/basic/59_Lunar_LEM_Rocket/javascript/lem.html public/basic-computer-games/59_Lunar_LEM_Rocket/javascript/lem.html
          cp /tmp/basic/59_Lunar_LEM_Rocket/javascript/lem.js public/basic-computer-games/59_Lunar_LEM_Rocket/javascript/lem.js
          cp /tmp/basic/59_Lunar_LEM_Rocket/javascript/lunar.html public/basic-computer-games/59_Lunar_LEM_Rocket/javascript/lunar.html
          cp /tmp/basic/59_Lunar_LEM_Rocket/javascript/lunar.js public/basic-computer-games/59_Lunar_LEM_Rocket/javascript/lunar.js

          mkdir -p public/basic-computer-games/36_Flip_Flop/javascript
          cp /tmp/basic/36_Flip_Flop/README.md public/basic-computer-games/36_Flip_Flop/README.md
          cp /tmp/basic/36_Flip_Flop/flipflop.bas public/basic-computer-games/36_Flip_Flop/flipflop.bas
          cp /tmp/basic/36_Flip_Flop/javascript/README.md public/basic-computer-games/36_Flip_Flop/javascript/README.md
          cp /tmp/basic/36_Flip_Flop/javascript/flipflop.html public/basic-computer-games/36_Flip_Flop/javascript/flipflop.html
          cp /tmp/basic/36_Flip_Flop/javascript/flipflop.js public/basic-computer-games/36_Flip_Flop/javascript/flipflop.js

          mkdir -p public/basic-computer-games/00_Utilities/javascript
          cp /tmp/basic/00_Utilities/javascript/style_terminal.css public/basic-computer-games/00_Utilities/javascript/style_terminal.css
          cp /tmp/basic/LICENSE public/basic-computer-games/UPSTREAM_UNLICENSE.txt

          cat > engine/games/LunarLemRocket.tsx <<'EOF'
          import React from 'react';
          import { useStore } from '../../store';

          export const LunarLemRocketGame: React.FC = () => {
            const stopGame = useStore((state) => state.stopGame);

            return (
              <div className="absolute inset-0 z-30 bg-black font-mono select-none overflow-hidden">
                <div className="absolute inset-x-0 top-0 z-20 h-12 border-b border-cyan-400/30 bg-black/95 flex items-center justify-between px-3">
                  <div className="text-[11px] tracking-[0.22em] text-cyan-300">LUNAR LEM ROCKET // ORIGINAL PORT</div>
                  <button
                    type="button"
                    onClick={stopGame}
                    className="min-h-11 px-4 border border-cyan-400/50 text-cyan-200 text-xs tracking-widest active:bg-cyan-300/15"
                  >
                    EXIT
                  </button>
                </div>
                <iframe
                  title="LUNAR LEM ROCKET"
                  src="/basic-computer-games/59_Lunar_LEM_Rocket/javascript/lem.html"
                  className="absolute inset-x-0 bottom-0 top-12 h-[calc(100%-3rem)] w-full border-0 bg-black"
                />
              </div>
            );
          };
          EOF

          cat > engine/games/FlipFlop.tsx <<'EOF'
          import React from 'react';
          import { useStore } from '../../store';

          export const FlipFlopGame: React.FC = () => {
            const stopGame = useStore((state) => state.stopGame);

            return (
              <div className="absolute inset-0 z-30 bg-black font-mono select-none overflow-hidden">
                <div className="absolute inset-x-0 top-0 z-20 h-12 border-b border-cyan-400/30 bg-black/95 flex items-center justify-between px-3">
                  <div className="text-[11px] tracking-[0.22em] text-cyan-300">FLIP FLOP // ORIGINAL PORT</div>
                  <button
                    type="button"
                    onClick={stopGame}
                    className="min-h-11 px-4 border border-cyan-400/50 text-cyan-200 text-xs tracking-widest active:bg-cyan-300/15"
                  >
                    EXIT
                  </button>
                </div>
                <iframe
                  title="FLIP FLOP"
                  src="/basic-computer-games/36_Flip_Flop/javascript/flipflop.html"
                  className="absolute inset-x-0 bottom-0 top-12 h-[calc(100%-3rem)] w-full border-0 bg-black"
                />
              </div>
            );
          };
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('types.ts')
          s = p.read_text()
          s = s.replace(" | 'BATTLE';", " | 'BATTLE' | 'LUNAR_LEM' | 'FLIP_FLOP';")
          p.write_text(s)

          p = Path('components/AppContent.tsx')
          s = p.read_text()
          s = s.replace("import { BattleGame } from '../engine/games/Battle';", "import { BattleGame } from '../engine/games/Battle';\nimport { LunarLemRocketGame } from '../engine/games/LunarLemRocket';\nimport { FlipFlopGame } from '../engine/games/FlipFlop';")
          s = s.replace("    BATTLE: BattleGame,", "    BATTLE: BattleGame,\n    LUNAR_LEM: LunarLemRocketGame,\n    FLIP_FLOP: FlipFlopGame,")
          p.write_text(s)

          p = Path('data/fileSystem.ts')
          s = p.read_text()
          s = s.replace("    f('battle', 'BATTLE.EXE', 'Original Naval Battle', 'BATTLE'),", "    f('lunar_lem', 'LUNAR_LEM.EXE', 'Original Lunar LEM Rocket', 'LUNAR_LEM'),\n    f('flip_flop', 'FLIP_FLOP.EXE', 'Original Flip Flop', 'FLIP_FLOP'),\n    f('battle', 'BATTLE.EXE', 'Original Naval Battle', 'BATTLE'),")
          s = s.replace("  DRIFT: '🏎️', DEFENDER: '🛡️', BATTLE: '⚓'", "  DRIFT: '🏎️', DEFENDER: '🛡️', BATTLE: '⚓', LUNAR_LEM: '🚀', FLIP_FLOP: '🔀'")
          p.write_text(s)
          PY

          rm -f .github/workflows/apply-lunar-flipflop-original.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import original Lunar LEM Rocket and Flip Flop unchanged"
          git push origin HEAD:feature/lunar-flipflop-original
