name: Export source

on:
  push:
    branches: [refactor/all-recommendations-2026-09-10]
    paths:
      - '.github/workflows/export-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          git archive --format=zip --output=neuro-runner-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-runner-source
          path: neuro-runner-source.zip
          if-no-files-found: error
