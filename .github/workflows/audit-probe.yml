name: Audit probe
on:
  push:
    branches: [audit/production-polish-2026-09-18]
permissions:
  contents: read
jobs:
  probe:
    if: >-
      !contains(github.event.head_commit.message, '[audit-prepare]') && !contains(github.event.head_commit.message, '[audit-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Browser tools
        run: |
          npm install --prefix /tmp/neuro-audit-tools --no-package-lock playwright@1.58.2 @axe-core/playwright@4.11.1
          node /tmp/neuro-audit-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser evidence
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/neuro-preview.log 2>&1 &
          node scripts/audit-probe.mjs
          node scripts/keyboard-browser-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.sha }}
          path: audit-results/
          retention-days: 7
