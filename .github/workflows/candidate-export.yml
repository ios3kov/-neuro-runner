name: Read verified candidate source
on:
  push:
    branches: [audit/production-polish-2026-09-18]
permissions:
  contents: read
  actions: read
jobs:
  source:
    if: contains(github.event.head_commit.message, '[audit-export]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        file: [store.ts, gameStore.ts, components/FileSystem.tsx, components/AppContent.tsx, types.ts, package.json, package-lock.json]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-642946942ac34a5389f7b6b9a80cf0639b29f645
          run-id: 35289775540
          github-token: ${{ github.token }}
          path: candidate-export
      - name: Read the candidate file for explicit connector review
        env:
          SOURCE_FILE: ${{ matrix.file }}
        run: |
          mkdir -p /tmp/candidate-source
          tar -xzf candidate-export/candidate-source.tar.gz -C /tmp/candidate-source
          cd /tmp/candidate-source
          node "$GITHUB_WORKSPACE/scripts/export-candidate.mjs" "$SOURCE_FILE"
