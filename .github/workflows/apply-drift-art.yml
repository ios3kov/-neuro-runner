name: Apply DRIFT hero renderer

on:
  push:
    branches:
      - art/drift-hero-pass
    paths:
      - .github/workflows/apply-drift-art.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/drift-hero-pass
          fetch-depth: 0
      - name: Integrate renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('engine/games/Drift.tsx')
          text = path.read_text()
          if "import { useStore } from '../../store';" not in text:
              text = text.replace("import { useGameStore } from '../../gameStore';", "import { useGameStore } from '../../gameStore';\nimport { useStore } from '../../store';")
          import_line = "import { drawDriftScene } from './drift/driftRenderer';"
          if import_line not in text:
              anchor = "import type { DriftGate, DriftState } from './drift/driftTypes';"
              if anchor in text: text = text.replace(anchor, anchor + "\n" + import_line)
              else:
                  first_type = text.find("import type ")
                  text = text[:first_type] + import_line + "\n" + text[first_type:]
          idx = text.find("  const updateStats = useGameStore")
          if idx >= 0 and "const lowPowerMode = useStore" not in text:
              end = text.find("\n", idx)
              text = text[:end+1] + "  const lowPowerMode = useStore((s) => s.user.settings.lowPowerMode ?? false);\n" + text[end+1:]
          pattern = re.compile(r"  const draw = useCallback\(\(ctx: CanvasRenderingContext2D, width: number, height: number\) => \{.*?\n  \}, \[\]\);\n\n  const instructions", re.S)
          replacement = "  const draw = useCallback((ctx: CanvasRenderingContext2D, width: number, height: number) => {\n    drawDriftScene(ctx, state.current, width, height, { lowPowerMode });\n  }, [lowPowerMode]);\n\n  const instructions"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit(f'Expected one draw block replacement, got {count}')
          path.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-drift-art.yml
      - name: Commit integrated renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/games/Drift.tsx .github/workflows/apply-drift-art.yml
          git commit -m "Integrate DRIFT technical-art renderer"
          git push origin HEAD:art/drift-hero-pass
