name: Verify production candidate
on:
  push:
    branches: [audit/production-polish-2026-09-18]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[audit-prepare]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce original state defects
        run: |
          mkdir -p audit-results
          set +e
          npm test -- tests/productionRegressions.test.ts > audit-results/regression-red.log 2>&1
          status=$?
          set -e
          cat audit-results/regression-red.log
          test "$status" -ne 0
          grep -q 'production state regressions' audit-results/regression-red.log
      - run: python3 scripts/apply-production-polish.py
      - name: Generate candidate dependency lockfile
        run: |
          npm install --save-dev --save-exact vitest@4.1.11 wrangler@4.134.0 tailwindcss@3.4.17 postcss@8.5.6 autoprefixer@10.4.21 tailwindcss-animate@1.0.7 eslint@9 @typescript-eslint/parser@8 prettier@3
          npm install --save-exact @fontsource/share-tech-mono@5 @fontsource/jetbrains-mono@5
          npm pkg set 'scripts.lint=eslint .' 'scripts.format:check=prettier --check App.tsx index.tsx styles.css components/Dialog.tsx state/persistedCore.ts utils/safeStorage.ts'
      - name: Format changed candidate files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR 291b7c0f527cd0901810b2db87e5909ad5376ab8 -- '*.ts' '*.tsx' '*.css' '*.mjs' '*.cjs' '*.json' '*.yml' '*.md')
          npx prettier --write "${files[@]}"
      - name: Verify candidate
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --json > audit-results/dependencies.json
          git diff --check
      - name: Browser tools
        run: |
          npm install --prefix /tmp/neuro-audit-tools --no-package-lock playwright @axe-core/playwright
          node /tmp/neuro-audit-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser evidence
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/neuro-preview.log 2>&1 &
          node scripts/audit-probe.mjs
      - name: Package candidate without repository credentials
        if: always()
        run: |
          mkdir -p audit-results
          git diff > audit-results/candidate.patch
          tar --exclude=.git --exclude=node_modules --exclude=audit-results --exclude=dist -czf /tmp/candidate-source.tar.gz .
          cp /tmp/candidate-source.tar.gz audit-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ github.sha }}
          path: audit-results/
          retention-days: 7
